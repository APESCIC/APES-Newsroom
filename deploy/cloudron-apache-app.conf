# ONE-TIME MANUAL SETUP REFERENCE. Copy the relevant parts of this into
# /app/data/apache/app.conf via the Cloudron File Manager
# (docs.cloudron.io/packages/lamp#configure-apache), then restart the app.
#
# DocumentRoot points at the *symlink* /app/data/current/public, which
# deploy/cloudron-activate.sh repoints atomically on every deploy - this
# is what makes activation atomic and rollback just a symlink swap back.
#
# The phpMyAdmin include is commented out per issue #3's requirement to
# disable public phpMyAdmin access in production
# (docs.cloudron.io/packages/lamp#disabling-phpmyadmin).

ServerName %{HTTP_HOST}

<VirtualHost *:80>
    DocumentRoot /app/data/current/public

    LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" proxy
    CustomLog "|/bin/cat" proxy
    ErrorLog "|/bin/cat"

    <Directory /app/data/current/public>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Required for the app to see the real client IP.
    Include "/app/code/apache/rpaf.conf"

    # phpMyAdmin disabled - see issue #3 acceptance criteria. Re-enable
    # only temporarily and deliberately for debugging, then disable again.
    # Include "/app/code/apache/phpmyadmin.conf"
</VirtualHost>
